<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sessão | ServiGo</title>
  <link rel="stylesheet" href="loginstyle.css">
</head>
 
<body>
 
  <!-- Retângulo central de login -->
  <main class="login-caixa">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="ServiGo">
    </a>
 
    <h1>Damos-lhe as boas-vindas</h1>
 
    <form id="formLogin" novalidate>
      <div class="campo" id="campoEmail">
        <label for="email">Endereço de e-mail*</label>
        <input type="email" id="email" placeholder="Introduza o seu e-mail" autocomplete="email">
        <small class="erro">É obrigatório um endereço de e-mail.</small>
      </div>
 
      <div class="campo" id="campoPassword">
        <label for="password">Palavra-passe*</label>
        <div class="campo-password">
          <input type="password" id="password" placeholder="Introduza uma palavra-passe" autocomplete="current-password">
          <button type="button" class="olho" id="verPassword" aria-label="Mostrar palavra-passe">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <small class="erro">É obrigatória uma palavra-passe.</small>
      </div>
 
      <a class="link-ajuda" href="">Precisa de ajuda com a palavra-passe?</a>
 
      <button type="submit" class="botao-principal">Iniciar sessão</button>
    </form>
 
    <div class="separador"><span>OU</span></div>
 
    <a class="botao-secundario" href="">Em alternativa, inscreva-se</a>
  </main>
 
  <a class="botao-ajuda" href="">? Ajuda</a>
 
  <script>
    // Mostrar / esconder palavra-passe
    const password = document.getElementById('password');
    document.getElementById('verPassword').addEventListener('click', function () {
      password.type = password.type === 'password' ? 'text' : 'password';
    });
 
    // Validação simples
    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();
      const pares = [
        [document.getElementById('email'), document.getElementById('campoEmail')],
        [password, document.getElementById('campoPassword')]
      ];
      let valido = true;
      pares.forEach(function (par) {
        const vazio = par[0].value.trim() === '';
        par[1].classList.toggle('invalido', vazio);
        if (vazio) valido = false;
      });
      if (valido) {
        alert('Login válido! (falta ligar ao servidor)');
      }
    });
  </script>
</body>
</html>
